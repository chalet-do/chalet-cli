# Runs on a version tag (.github/workflows/release.yml): the archives and the
# Linux packages go on the GitHub release, and the Homebrew formula and the
# Scoop manifest into chalet-do/homebrew-tap.
version: 2

project_name: chalet

builds:
  - main: ./cmd/chalet
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/chalet-do/chalet-cli/internal/commands.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - description: &description Connect Claude to your Chalet
    homepage: &homepage https://github.com/chalet-do/chalet-cli
    maintainer: Chalet <hey@chalet.do>
    formats: [deb, rpm]

# A formula, not the cask GoReleaser now prefers: Homebrew quarantines what a
# cask downloads, and macOS refuses a quarantined binary that Apple has not
# notarized. A formula's download is never quarantined.
brews:
  - repository: &tap
      owner: chalet-do
      name: homebrew-tap
      git:
        url: git@github.com:chalet-do/homebrew-tap.git
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    directory: Formula
    description: *description
    homepage: *homepage

scoops:
  - repository: *tap
    description: *description
    homepage: *homepage
